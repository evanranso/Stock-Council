# Render Blueprint for the API. In Render: New -> Blueprint -> pick this repo.
# Secrets marked sync: false are entered in the Render dashboard, never committed.
services:
  - type: web
    name: stock-council-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: FINNHUB_API_KEY
        sync: false
      - key: FRED_API_KEY
        sync: false
      - key: SEC_USER_AGENT
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: ALLOWED_ORIGIN_REGEX
        value: https://.*\.stock-council\.pages\.dev
      - key: TRUST_PROXY
        value: "true"
      - key: RATE_LIMIT_PER_HOUR
        value: "10"
      - key: MAX_RUNS_PER_DAY
        value: "40"
      - key: CACHE_TTL_HOURS
        value: "12"
      - key: CLAUDE_MODEL
        value: claude-opus-5-5
